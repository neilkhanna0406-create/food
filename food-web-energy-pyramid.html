<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;}
.banner{width:100%;height:100vh;overflow:hidden;position:relative;background:linear-gradient(180deg,#0a0500 0%,#2a1000 50%,#1a0800 100%);}
.energy-bar{position:absolute;width:3px;border-radius:2px;animation:eflow linear infinite;}
@keyframes eflow{0%{transform:translateY(100vh);opacity:0;}40%{opacity:.8;}100%{transform:translateY(-20px);opacity:0;}}
.node{position:absolute;border-radius:50%;animation:nodepulse 2s ease-in-out infinite;}
@keyframes nodepulse{0%,100%{transform:scale(1);opacity:.4;}50%{transform:scale(1.6);opacity:.9;}}
.fire{position:absolute;border-radius:50% 50% 20% 20%;animation:flicker .7s ease-in-out infinite alternate;}
@keyframes flicker{from{transform:scaleY(1) translateY(0);}to{transform:scaleY(1.2) translateY(-4px);}}
.tw{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:10;white-space:nowrap;}
.ey{font-family:Georgia,serif;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,180,50,.85);margin-bottom:6px;animation:fu .8s ease both;}
.mt{font-family:Georgia,serif;font-weight:700;color:#fff;font-size:30px;line-height:1.1;animation:fu .8s ease .15s both;text-shadow:0 2px 20px rgba(0,0,0,.8);}
.mt span{color:#ffaa44;}
.br{height:3px;background:#ffaa44;border-radius:2px;margin:8px auto 0;animation:gb 1s ease .3s both;}
@keyframes fu{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
@keyframes gb{from{width:0;}to{width:60px;}}
</style>
</head>
<body>
<div class="banner">
  <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:100px solid transparent;border-right:100px solid transparent;border-bottom:140px solid rgba(255,120,0,.07);"></div>
  <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:68px solid transparent;border-right:68px solid transparent;border-bottom:95px solid rgba(255,160,0,.07);"></div>
  <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:38px solid transparent;border-right:38px solid transparent;border-bottom:55px solid rgba(255,200,0,.09);"></div>
  <div class="energy-bar" style="height:40px;background:linear-gradient(rgba(255,180,0,0),rgba(255,180,0,.9));left:47%;animation-duration:1.8s;animation-delay:0s;"></div>
  <div class="energy-bar" style="height:40px;background:linear-gradient(rgba(255,140,0,0),rgba(255,140,0,.9));left:49.5%;animation-duration:1.8s;animation-delay:.4s;"></div>
  <div class="energy-bar" style="height:40px;background:linear-gradient(rgba(255,200,0,0),rgba(255,200,0,.9));left:52%;animation-duration:1.8s;animation-delay:.8s;"></div>
  <div class="energy-bar" style="height:35px;background:linear-gradient(rgba(255,160,0,0),rgba(255,160,0,.8));left:45%;animation-duration:2.2s;animation-delay:.2s;"></div>
  <div class="energy-bar" style="height:35px;background:linear-gradient(rgba(255,100,0,0),rgba(255,100,0,.8));left:54%;animation-duration:2.2s;animation-delay:.6s;"></div>
  <div class="node" style="width:12px;height:12px;background:#ffaa00;left:18%;top:28%;box-shadow:0 0 12px #ffaa00;animation-delay:0s;"></div>
  <div class="node" style="width:9px;height:9px;background:#ff7700;left:32%;top:52%;box-shadow:0 0 8px #ff7700;animation-delay:.5s;"></div>
  <div class="node" style="width:12px;height:12px;background:#ffcc00;right:18%;top:32%;box-shadow:0 0 12px #ffcc00;animation-delay:1s;"></div>
  <div class="node" style="width:9px;height:9px;background:#ff9900;right:32%;top:55%;box-shadow:0 0 8px #ff9900;animation-delay:.3s;"></div>
  <div class="fire" style="width:10px;height:22px;background:linear-gradient(#ffdd00,#ff5500);left:5%;bottom:12%;animation-delay:0s;"></div>
  <div class="fire" style="width:7px;height:16px;background:linear-gradient(#ffcc00,#ff3300);left:8.5%;bottom:16%;animation-delay:.2s;"></div>
  <div class="fire" style="width:10px;height:22px;background:linear-gradient(#ffdd00,#ff5500);right:5%;bottom:12%;animation-delay:.1s;"></div>
  <div class="fire" style="width:7px;height:16px;background:linear-gradient(#ffcc00,#ff3300);right:8.5%;bottom:16%;animation-delay:.3s;"></div>
  <div class="tw">
    <div class="ey">Tropical Rainforest</div>
    <div class="mt">&#128376; <span>Food Web &amp; Energy Pyramid</span></div>
    <div class="br"></div>
  </div>
</div>
</body>
</html>
